<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Contato - Vinheria Agnello</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
    <h1>Contato</h1>
    <nav>
        <a href="../index.html">Início</a>
        <a href="produtos.html">Produtos</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
    </nav>
</header>

<main class="bloco-conteudo" style="display: flex; justify-content: center ;align-items: center;">
    
        <div class="bloco" style="width: 400px; height: auto;">
            
            <div class="bloco-conteudo">
                <h2>Fale conosco</h2>
            </div>

            <div class="bloco-conteudo">
                <input id="nome" class="input" type="text" placeholder="Seu nome" required>
            </div>

            <div class="bloco-conteudo">
                <textarea id="duvida" class="textarea" placeholder="Sua dúvida" rows="5" required></textarea>
            </div>

            <div class="bloco-conteudo">
                <button class="btn-whatsapp" id="btnWhatsapp" style="margin-top: 10px;">
                    Falar no WhatsApp
                </button>
            </div>

        </div>
    </main>
    <script>
const botaoWhatsapp = document.getElementById("btnWhatsapp");

botaoWhatsapp.addEventListener("click", function () {
    const nome = document.getElementById("nome").value;
    const duvida = document.getElementById("duvida").value;

    const mensagem = `Olá, meu nome é ${nome} e tenho uma dúvida: ${duvida}`;
    const mensagemCodificada = encodeURIComponent(mensagem);

    const numero = "5511999999999";
    const linkWhatsapp = `https://wa.me/${numero}?text=${mensagemCodificada}`;

    window.open(linkWhatsapp, "_blank");
});
</script>
</body>
</html>
